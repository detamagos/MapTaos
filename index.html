<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MapTaos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      margin-top: 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 16px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    .btn-primary {
      background: #1f7a5c;
      color: white;
      font-weight: bold;
    }

    .btn-result {
      background: #111;
      color: white;
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .btn-secondary {
      background: #e7ebee;
      color: #222;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .small {
      font-size: 14px;
      color: #666;
      text-align: center;
      margin-top: 14px;
    }

    .player {
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 22px;
    }

    .detected-score {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0;
    }

    .detected-date {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .success {
      background: #e8f7ef;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      margin-top: 15px;
    }

    .error {
      background: #fdecec;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      margin-top: 15px;
    }

    .home-section-title {
      margin: 0 0 12px;
      font-size: 20px;
    }

    .placeholder {
      background: #eef1f3;
      border-radius: 12px;
      padding: 16px;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- LOGIN -->
  <section id="loginView">

    <div class="card">

      <h1>🌍 MapTaos</h1>
      <p class="subtitle">Acceso a la peña</p>

      <input
        type="email"
        id="email"
        placeholder="Correo electrónico"
      >

      <input
        type="password"
        id="password"
        placeholder="Contraseña"
      >

      <button
        class="btn-primary"
        id="loginButton"
      >
        Entrar
      </button>

      <p class="small">
        Acceso reservado a miembros autorizados.
      </p>

    </div>

  </section>


  <!-- APP -->
  <section id="appView" class="hidden">

    <h1>🌍 MapTaos</h1>
    <p class="subtitle">Peña MapTaos</p>

    <div
      class="player"
      id="playerName"
    ></div>

    <button
      class="btn-result"
      id="pasteResultButton"
    >
      📋 Pegar resultado
    </button>


    <!-- PEGADO MANUAL DE RESPALDO -->
    <div
      class="card hidden"
      id="manualCard"
    >

      <p class="small">
        Chrome no pudo leer el portapapeles automáticamente.
        Pega aquí el resultado de MapTap.
      </p>

      <textarea
        id="manualText"
        placeholder="Pega aquí el resultado..."
      ></textarea>

      <button
        class="btn-primary"
        id="analyzeManualButton"
      >
        Analizar resultado
      </button>

    </div>


    <!-- CONFIRMACIÓN -->
    <div
      class="card hidden"
      id="confirmationCard"
    >

      <div class="small">
        Final Score detectado
      </div>

      <div
        class="detected-score"
        id="detectedScore"
      ></div>

      <div
        class="detected-date"
        id="detectedDate"
      ></div>

      <button
        class="btn-primary"
        id="saveResultButton"
      >
        Guardar resultado
      </button>

      <button
        class="btn-secondary"
        id="cancelButton"
      >
        Cancelar
      </button>

    </div>


    <div id="messageBox"></div>


    <div class="card">
      <h2 class="home-section-title">
        Clasificación de hoy
      </h2>

      <div id="rankingHoy"
      class="placeholder">
        Cargando clasificación...
      </div>
    </div>

  </section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://oktfgwieowixtoxbdbmg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_9LLVrCKy2_fl_vzouJGTfQ_h22GzOGi";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

let jugadorActual = null;
let resultadoPendiente = null;

const loginView =
  document.getElementById("loginView");

const appView =
  document.getElementById("appView");

const loginButton =
  document.getElementById("loginButton");

const pasteResultButton =
  document.getElementById("pasteResultButton");

const manualCard =
  document.getElementById("manualCard");

const manualText =
  document.getElementById("manualText");

const analyzeManualButton =
  document.getElementById("analyzeManualButton");

const confirmationCard =
  document.getElementById("confirmationCard");

const detectedScore =
  document.getElementById("detectedScore");

const detectedDate =
  document.getElementById("detectedDate");

const saveResultButton =
  document.getElementById("saveResultButton");

const cancelButton =
  document.getElementById("cancelButton");

const playerName =
  document.getElementById("playerName");

const messageBox =
  document.getElementById("messageBox");


function mostrarLogin() {
  loginView.classList.remove("hidden");
  appView.classList.add("hidden");
}

function mostrarApp() {
  loginView.classList.add("hidden");
  appView.classList.remove("hidden");
}


loginButton.addEventListener(
  "click",
  async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      alert("Introduce correo y contraseña.");
      return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Entrando...";

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    loginButton.disabled = false;
    loginButton.textContent = "Entrar";

    if (error) {
      alert("No se ha podido iniciar sesión.");
      return;
    }

    await iniciarApp();
  }
);


async function cargarJugador() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();

  if (!user) {
    return false;
  }

  const {
    data,
    error
  } =
    await supabaseClient
      .from("jugadores")
      .select("id, nombre, activo")
      .eq("auth_user_id", user.id)
      .single();

  if (error || !data) {
    mostrarMensaje(
      "Tu cuenta no está vinculada a ningún jugador.",
      "error"
    );
    return false;
  }

  jugadorActual = data;

  playerName.textContent =
    "👤 " + data.nombre;

  return true;
}


function analizarResultado(texto) {

  const scoreMatch =
    texto.match(
      /Final score:\s*(\d+)/i
    );
const lineaRondas =
  texto
    .split("\n")
    .find(linea =>
      !/www\.maptap\.gg/i.test(linea) &&
      !/Final score:/i.test(linea) &&
      /\d/.test(linea)
    );

if (!lineaRondas) {
  throw new Error(
    "No se encontraron las 5 rondas."
  );
}

const puntuaciones =
  [...lineaRondas.matchAll(/(\d{1,3})/g)]
    .map(resultado => Number(resultado[1]));

if (
  puntuaciones.length !== 5 ||
  puntuaciones.some(
    puntos => puntos < 0 || puntos > 100
  )
) {
  throw new Error(
    "No se pudieron interpretar las 5 rondas."
  );
}
  const banderas =
  [...lineaRondas.matchAll(/([\p{Regional_Indicator}]{2})\s*\d{1,3}/gu)]
    .map(resultado => resultado[1]);

const tieneBanderas = banderas.length === 5;
  const fechaMatch =
    texto.match(
      /www\.maptap\.gg\s+([A-Za-z]+)\s+(\d{1,2})/i
    );

  if (!scoreMatch) {
    throw new Error(
      "No se encontró el Final Score."
    );
  }

  if (!fechaMatch) {
    throw new Error(
      "No se encontró la fecha."
    );
  }

  const score =
    Number(scoreMatch[1]);

  if (
    !Number.isInteger(score) ||
    score < 0 ||
    score > 1000
  ) {
    throw new Error(
      "El Final Score no es válido."
    );
  }

  const meses = {
    january: 0,
    february: 1,
    march: 2,
    april: 3,
    may: 4,
    june: 5,
    july: 6,
    august: 7,
    september: 8,
    october: 9,
    november: 10,
    december: 11
  };

  const mesTexto =
    fechaMatch[1].toLowerCase();

  const dia =
    Number(fechaMatch[2]);

  const mes =
    meses[mesTexto];

  if (mes === undefined) {
    throw new Error(
      "El mes no es válido."
    );
  }

  const hoy =
    new Date();

  let año =
    hoy.getFullYear();

  let fecha =
    new Date(
      año,
      mes,
      dia,
      12,
      0,
      0
    );

  const diferenciaDias =
    (
      fecha.getTime() -
      hoy.getTime()
    ) / 86400000;

  if (diferenciaDias > 30) {
    año = año - 1;
  }

  const fechaSQL =
    año
    + "-"
    + String(mes + 1).padStart(2, "0")
    + "-"
    + String(dia).padStart(2, "0");

  return {
  score,
  fechaSQL,
  fechaVisible:
    dia
    + "/"
    + String(mes + 1).padStart(2, "0")
    + "/"
    + año,

  ronda1: puntuaciones[0],
  ronda2: puntuaciones[1],
  ronda3: puntuaciones[2],
  ronda4: puntuaciones[3],
  ronda5: puntuaciones[4],
tieneBanderas,
banderas,
  textoOriginal:
    texto
};
}


function prepararResultado(texto) {

  limpiarMensaje();

  try {

    resultadoPendiente =
      analizarResultado(texto);

    detectedScore.textContent =
      resultadoPendiente.score;

    detectedDate.textContent =
      "📅 "
      + resultadoPendiente.fechaVisible;

    confirmationCard
      .classList
      .remove("hidden");

    manualCard
      .classList
      .add("hidden");

  }
  catch (error) {

    resultadoPendiente = null;

    mostrarMensaje(
      error.message,
      "error"
    );
  }
}


pasteResultButton.addEventListener(
  "click",
  async () => {

    limpiarMensaje();

    try {

      const texto =
        await navigator.clipboard.readText();

      if (!texto.trim()) {
        throw new Error(
          "El portapapeles está vacío."
        );
      }

      prepararResultado(texto);

    }
    catch (error) {

      manualCard
        .classList
        .remove("hidden");

      mostrarMensaje(
        "No se pudo leer automáticamente el portapapeles.",
        "error"
      );
    }
  }
);


analyzeManualButton.addEventListener(
  "click",
  () => {

    const texto =
      manualText.value.trim();

    if (!texto) {

      mostrarMensaje(
        "Pega primero el resultado de MapTap.",
        "error"
      );

      return;
    }

    prepararResultado(texto);
  }
);


saveResultButton.addEventListener(
  "click",
  async () => {

    if (
      !resultadoPendiente ||
      !jugadorActual
    ) {
      return;
    }

    saveResultButton.disabled = true;
    saveResultButton.textContent =
      "Guardando...";

    const {
      data: existente,
      error: errorConsulta
    } =
      await supabaseClient
        .from("resultados")
        .select("id, final_score")
        .eq(
          "jugador_id",
          jugadorActual.id
        )
        .eq(
          "fecha",
          resultadoPendiente.fechaSQL
        )
        .maybeSingle();

    if (errorConsulta) {

      saveResultButton.disabled = false;
      saveResultButton.textContent =
        "Guardar resultado";

      mostrarMensaje(
        "No se pudo comprobar el resultado.",
        "error"
      );

      return;
    }

    if (existente) {

      saveResultButton.disabled = false;
      saveResultButton.textContent =
        "Guardar resultado";

      confirmationCard
        .classList
        .add("hidden");

      mostrarMensaje(
        "Ya tienes un resultado guardado para ese día: "
        + existente.final_score
        + " puntos.",
        "error"
      );

      return;
    }

    const { error } =
      await supabaseClient
        .from("resultados")
    .insert({
  jugador_id: jugadorActual.id,
  fecha: resultadoPendiente.fechaSQL,
  final_score: resultadoPendiente.score,

  ronda_1: resultadoPendiente.ronda1,
  ronda_2: resultadoPendiente.ronda2,
  ronda_3: resultadoPendiente.ronda3,
  ronda_4: resultadoPendiente.ronda4,
  ronda_5: resultadoPendiente.ronda5,

  texto_original: resultadoPendiente.textoOriginal
});

    saveResultButton.disabled = false;
    saveResultButton.textContent =
      "Guardar resultado";

    if (error) {

      mostrarMensaje(
        "No se pudo guardar el resultado.",
        "error"
      );

      return;
    }
if (resultadoPendiente.tieneBanderas) {

  await supabaseClient
    .from("rondas_dia")
    .upsert(
      {
        fecha: resultadoPendiente.fechaSQL,
        pais_1: resultadoPendiente.banderas[0],
        pais_2: resultadoPendiente.banderas[1],
        pais_3: resultadoPendiente.banderas[2],
        pais_4: resultadoPendiente.banderas[3],
        pais_5: resultadoPendiente.banderas[4]
      },
      {
        onConflict: "fecha",
        ignoreDuplicates: true
      }
    );
}
    confirmationCard
      .classList
      .add("hidden");

    manualText.value = "";

    mostrarMensaje(
      "✅ Resultado guardado: "
      + resultadoPendiente.score
      + " puntos.",
      "success"
    );
    await cargarRankingHoy();

    resultadoPendiente = null;
  }
);


cancelButton.addEventListener(
  "click",
  () => {

    resultadoPendiente = null;

    confirmationCard
      .classList
      .add("hidden");
  }
);


function mostrarMensaje(
  texto,
  tipo
) {

  messageBox.innerHTML =
    '<div class="'
    + tipo
    + '">'
    + texto
    + '</div>';
}


function limpiarMensaje() {
  messageBox.innerHTML = "";
}


async function cargarRankingHoy() {

  const rankingHoy =
    document.getElementById("rankingHoy");

  const hoy =
    new Date()
      .toISOString()
      .slice(0, 10);

  const {
    data,
    error
  } =
    await supabaseClient
      .from("ranking_diario")
      .select(
        "fecha, jugador_id, nombre, final_score, posicion"
      )
      .eq("fecha", hoy)
      .order("posicion", {
        ascending: true
      });

  if (error) {

    rankingHoy.innerHTML =
      "No se pudo cargar la clasificación.";

    return;
  }

  if (!data || data.length === 0) {

    rankingHoy.innerHTML =
      "Todavía no hay resultados hoy.";

    return;
  }

  rankingHoy.innerHTML =
    data.map(fila => {

      let medalla = "";

      if (fila.posicion === 1) {
        medalla = "🥇";
      }
      else if (fila.posicion === 2) {
        medalla = "🥈";
      }
      else if (fila.posicion === 3) {
        medalla = "🥉";
      }

      return `
        <div style="
          display:flex;
          justify-content:space-between;
          align-items:center;
          padding:10px 0;
          border-bottom:1px solid #ddd;
        ">
          <span>
            ${medalla}
            ${fila.posicion}.
            <strong>${fila.nombre}</strong>
          </span>

          <strong>
            ${fila.final_score}
          </strong>
        </div>
      `;

    }).join("");
}


async function iniciarApp() {

  mostrarApp();

  await cargarJugador();

  await cargarRankingHoy();

}


async function comprobarSesion() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {
    await iniciarApp();
  }
  else {
    mostrarLogin();
  }
}

comprobarSesion();

</script>

</body>
</html>
